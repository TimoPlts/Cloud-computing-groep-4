services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
    networks:
      - cloudnet

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-groep4}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-sensordata}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - cloudnet

  portainer:
    image: portainer/portainer-ce:latest
    command:
      - --admin-password
      - '$$2y$$05$$v0lfI7BazekNRqrsjFgywuelrobznuMTZvSzJjPWDdPeWRljcivD.'
    restart: unless-stopped
    ports: 
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - cloudnet

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      INFLUXDB_ORG: ${INFLUXDB_ORG:-groep4}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-sensordata}
      INFLUXDB_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - influxdb
    networks:
      - cloudnet

  nodered:
    build:
      context: ./nodered
      args:
        NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET}
    container_name: nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-mF0B9oNC8xw5l1o_yw3asTWLtIhmGmk2WdJHioLG627A1IqmsgXnZuc7GmNgzzMMplAry7O8EzUFVL9EdKyalQ==}
    volumes:
      - nodered-data:/data
    depends_on:
      - mosquitto
      - influxdb
    networks:
      - cloudnet

  sensor-sim:
    build: ./sensor-sim
    container_name: sensor-sim
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    depends_on:
      - mosquitto
    networks:
      - cloudnet

  discord-monitor:
    build: ./monitor
    restart: unless-stopped
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      MONITOR_INTERVAL: ${MONITOR_INTERVAL:-60}
      MONITOR_STARTUP_DELAY: ${MONITOR_STARTUP_DELAY:-60}
      MONITOR_TARGETS: ${MONITOR_TARGETS:-influxdb grafana portainer nodered mosquitto sensor-sim}
      STATE_DIR: /state
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - discord-monitor-state:/state
    depends_on:
      - mosquitto
      - influxdb
      - portainer
      - grafana
      - nodered
      - sensor-sim
    networks:
      - cloudnet

networks:
  cloudnet:
    driver: bridge

volumes: 
  influxdb-data:
  nodered-data:
  portainer_data:
  grafana-data:
  discord-monitor-state:
